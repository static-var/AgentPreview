name: Publish Gradle Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-gradle-plugin-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            echo "Expected a semantic version like 0.1.0 or 0.1.0-rc.1." >&2
            exit 1
          fi

      - name: Run quality gates
        run: ./gradlew spotlessCheck detekt :plugin:test :preview-scanner:test validatePlugins

      - name: Validate release dependency graph
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew :plugin:compileKotlin "-PVERSION_NAME=$RELEASE_VERSION"

      - name: Validate release tag does not exist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="agentpreview-gradle-plugin-v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi

      - name: Create draft GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="agentpreview-gradle-plugin-v${RELEASE_VERSION}"
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "AgentPreview Gradle plugin ${RELEASE_VERSION}" \
            --generate-notes \
            --draft

      - name: Publish plugin to Gradle Plugin Portal
        id: publish_plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew publishPlugins "-PVERSION_NAME=$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "agentpreview-gradle-plugin-v${RELEASE_VERSION}" --draft=false

      - name: Delete draft GitHub release and tag after failed publish
        if: failure() && steps.publish_plugin.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="agentpreview-gradle-plugin-v${RELEASE_VERSION}"
          if gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release delete "${tag}" --cleanup-tag --yes
          fi
