name: Publish preview-scanner

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-preview-scanner-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run preview-scanner quality gates
        run: ./gradlew spotlessCheck detekt :preview-scanner:test

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            echo "Expected a semantic version like 0.1.0 or 0.1.0-rc.1." >&2
            exit 1
          fi

      - name: Validate release tag does not exist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="preview-scanner-v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi

      - name: Create local release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="preview-scanner-v${RELEASE_VERSION}"
          git tag "${tag}" "${GITHUB_SHA}"

      - name: Publish preview-scanner to Maven Central
        id: publish_scanner
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew :preview-scanner:publishAndReleaseToMavenCentral "-PVERSION_NAME=$RELEASE_VERSION"

      - name: Push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="preview-scanner-v${RELEASE_VERSION}"
          git push origin "refs/tags/${tag}"
